<header class="site-header">
  <div class="site-header__inner">
    <a routerLink="/home" class="brand" [attr.aria-label]="brandTitle() + ' home'" (click)="closeMenu()">
      <span class="brand__mark"><span class="brand__dot"></span></span>
      <span class="brand__text">{{ brandTitle() }}</span>
    </a>

    <nav class="nav-pill" aria-label="Primary navigation">
      @for (item of navItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="is-active" class="nav-link">{{ item.label }}</a>
      }
    </nav>

    <div class="header-actions">
      <a routerLink="/dashboard" class="admin-btn" title="Open dashboard">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span>Dashboard</span>
      </a>

      <button type="button" class="menu-btn" aria-label="Toggle menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div class="mobile-menu">
      @for (item of navItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="is-active" class="nav-link" (click)="closeMenu()">{{ item.label }}</a>
      }
    </div>
  }
</header>
